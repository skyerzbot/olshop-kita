
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ee4d2d">
  <title>Olshop Kita - Belanja Online</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    header {
      background: #ee4d2d;
      color: white;
      padding: 18px 5%;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand { font-size: 24px; font-weight: bold; }
    .search {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }
    input, button {
      font: inherit;
      padding: 12px;
      border-radius: 8px;
    }
    input { border: 1px solid #ddd; min-width: 0; }
    .search input { flex: 1; }
    button {
      border: 0;
      background: #ee4d2d;
      color: white;
      cursor: pointer;
    }
    .search button { background: #333; }
    main { padding: 20px 5%; }
    .banner {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 22px;
    }
    .banner h1 { color: #ee4d2d; margin-top: 0; }
    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px #0000000a;
    }
    .picture {
      background: #fff0eb;
      height: 125px;
      display: grid;
      place-items: center;
      font-size: 55px;
    }
    .info { padding: 12px; }
    .name { min-height: 38px; }
    .price {
      color: #ee4d2d;
      font-weight: bold;
      margin: 10px 0;
    }
    .card button { width: 100%; }
    .section-title { margin-bottom: 15px; }
    #cart {
      background: white;
      margin-top: 24px;
      padding: 18px;
      border-radius: 12px;
    }
    #cart button { margin: 5px 0; }
    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
    @media (min-width: 650px) {
      .products { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .picture { height: 170px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand">🛍️ Olshop Kita</div>
      <div>Belanja mudah, harga bersahabat!</div>
    </div>
    <div class="search">
      <input id="search" placeholder="Cari produk..." aria-label="Cari produk">
      <button onclick="renderProducts()">Cari</button>
    </div>
  </header>

  <main>
    <section class="banner">
      <h1>Selamat Datang!</h1>
      <p>Temukan produk favoritmu di Olshop Kita.</p>
      <p>Promo menarik menantimu setiap hari.</p>
    </section>

    <h2 class="section-title">✨ Produk Pilihan</h2>
    <section class="products" id="products"></section>

    <section id="cart">
      <h2>🛒 Keranjang Belanja</h2>
      <div id="cartItems">Keranjang masih kosong.</div>
      <h3 id="total">Total: Rp0</h3>
      <button onclick="checkout()">Lanjutkan Pesanan</button>
      <p id="notice"></p>
    </section>
  </main>

  <footer>
    © 2026 Olshop Kita · Website toko online
  </footer>

  <script>
    const products = [
      { id: 1, name: "Kaos Casual", price: 50000, icon: "👕" },
      { id: 2, name: "Sepatu Keren", price: 125000, icon: "👟" },
      { id: 3, name: "Tas Harian", price: 85000, icon: "🎒" },
      { id: 4, name: "Jam Tangan", price: 75000, icon: "⌚" },
      { id: 5, name: "Headphone", price: 99000, icon: "🎧" },
      { id: 6, name: "Kacamata", price: 45000, icon: "🕶️" },
      { id: 7, name: "Topi Casual", price: 35000, icon: "🧢" },
      { id: 8, name: "Botol Minum", price: 25000, icon: "🧴" }
    ];

    let cart = [];

    function rupiah(number) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(number);
    }

    function renderProducts() {
      const keyword = document.getElementById("search")
        .value.toLowerCase().trim();

      const filtered = products.filter(p =>
        p.name.toLowerCase().includes(keyword)
      );

      document.getElementById("products").innerHTML =
        filtered.length
          ? filtered.map(p => `
            <article class="card">
              <div class="picture">${p.icon}</div>
              <div class="info">
                <div class="name">${p.name}</div>
                <div class="price">${rupiah(p.price)}</div>
                <button onclick="addToCart(${p.id})">
                  + Keranjang
                </button>
              </div>
            </article>
          `).join("")
          : "<p>Produk tidak ditemukan.</p>";
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const item = cart.find(p => p.id === id);

      if (item) item.qty++;
      else cart.push({ ...product, qty: 1 });

      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cartItems");

      container.innerHTML = cart.length
        ? cart.map(p => `
          <p>
            ${p.icon} ${p.name} × ${p.qty}
            — ${rupiah(p.price * p.qty)}
            <button onclick="removeItem(${p.id})">Hapus</button>
          </p>
        `).join("")
        : "Keranjang masih kosong.";

      const total = cart.reduce(
        (sum, p) => sum + p.price * p.qty, 0
      );

      document.getElementById("total").textContent =
        "Total: " + rupiah(total);
    }

    function removeItem(id) {
      cart = cart.filter(p => p.id !== id);
      renderCart();
    }

    function checkout() {
      document.getElementById("notice").textContent =
        cart.length
          ? "Demo berhasil! Checkout dan pembayaran online akan kita tambahkan berikutnya."
          : "Silakan tambahkan produk ke keranjang dahulu.";
    }

    document.getElementById("search").addEventListener(
      "keydown", event => {
        if (event.key === "Enter") renderProducts();
      }
    );

    renderProducts();
    renderCart();
  </script>

</body>
</html>
