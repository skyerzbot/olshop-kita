<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ee4d2d">
  <title>Olshop Kita - Belanja Online</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }
    header {
      background: #ee4d2d;
      color: white;
      padding: 18px 5%;
    }
    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand { font-size: 24px; font-weight: bold; }
    .search {
      display: flex;
      gap: 8px;
      margin-top: 18px;
    }
    input, button {
      font: inherit;
      padding: 12px;
      border-radius: 8px;
    }
    input { border: 1px solid #ddd; min-width: 0; }
    .search input { flex: 1; }
    button {
      border: 0;
      background: #ee4d2d;
      color: white;
      cursor: pointer;
    }
    .search button { background: #333; }
    
    /* Style untuk Tombol Kategori */
    .categories {
      display: flex;
      gap: 8px;
      margin-top: 12px;
      overflow-x: auto;
      padding-bottom: 4px;
    }
    .cat-btn {
      background: rgba(255, 255, 255, 0.2);
      color: white;
      border: 1px solid rgba(255, 255, 255, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 14px;
      cursor: pointer;
      white-space: nowrap;
    }
    .cat-btn.active {
      background: white;
      color: #ee4d2d;
      font-weight: bold;
    }

    main { padding: 20px 5%; }
    .banner {
      background: white;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 22px;
    }
    .banner h1 { color: #ee4d2d; margin-top: 0; }
    .products {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 6px #0000000a;
    }
    .picture {
      background: #fff0eb;
      height: 125px;
      display: grid;
      place-items: center;
      font-size: 55px;
      overflow: hidden;
    }
    .info { padding: 12px; }
    .name { min-height: 38px; }
    .price {
      color: #ee4d2d;
      font-weight: bold;
      margin: 10px 0;
    }
    .card button { width: 100%; }
    .section-title { margin-bottom: 15px; }
    #cart {
      background: white;
      margin-top: 24px;
      padding: 18px;
      border-radius: 12px;
    }
    #cart button { margin: 5px 0; }
    footer {
      text-align: center;
      padding: 25px;
      color: #777;
      font-size: 13px;
    }
    @media (min-width: 650px) {
      .products { grid-template-columns: repeat(4, minmax(0, 1fr)); }
      .picture { height: 170px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <div class="brand">🛍️ Olshop Kita</div>
      <div>Belanja mudah, harga bersahabat!</div>
    </div>
    <div class="search">
      <input id="search" placeholder="Cari produk..." aria-label="Cari produk">
      <button onclick="renderProducts()">Cari</button>
    </div>
    <!-- Tombol Kategori -->
    <div class="categories" id="categoryContainer">
      <button class="cat-btn active" onclick="filterCategory('Semua', this)">Semua</button>
    </div>
  </header>

  <main>
    <section class="banner">
      <h1>Selamat Datang!</h1>
      <p>Temukan produk favoritmu di Olshop Kita.</p>
      <p>Promo menarik menantimu setiap hari.</p>
    </section>

    <h2 class="section-title">✨ Produk Pilihan</h2>
    <section class="products" id="products"></section>

    <section id="cart">
      <h2>🛒 Keranjang Belanja</h2>
      <div id="cartItems">Keranjang masih kosong.</div>
      <h3 id="total">Total: Rp0</h3>
      <button onclick="checkout()">Lanjutkan Pesanan</button>
      <p id="notice"></p>
    </section>
  </main>

  <footer>
    © 2026 Olshop Kita · Website toko online
  </footer>

  <!-- 1. Load Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const supabaseUrl = 'https://ztpodvtqggdjxkkzupax.supabase.co';
    const supabaseKey = 'sb_publishable_wiw5M4-J2fgfEg8GZrWCGw_rgjGPN3O';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);
  </script>

  <!-- 2. Script utama website -->
  <script>
    let products = [];
    let cart = [];
    let selectedCategory = "Semua";

    async function fetchProducts() {
      try {
        document.getElementById("products").innerHTML = "<p>Memuat produk dari database...</p>";

        const { data, error } = await supabaseClient
          .from('products')
          .select('*');
          
        if (error) {
          document.getElementById("products").innerHTML = `<p style="color:red;">Error Supabase: ${error.message}</p>`;
        } else {
          products = data || [];
          generateCategories();
          renderProducts();
        }
      } catch (err) {
        document.getElementById("products").innerHTML = `<p style="color:red;">Error Sistem: ${err.message}</p>`;
      }
    }

    function generateCategories() {
      const container = document.getElementById("categoryContainer");
      // Ambil kategori unik dari data produk
      const categories = ["Semua", ...new Set(products.map(p => p.category).filter(Boolean))];
      
      container.innerHTML = categories.map(cat => `
        <button class="cat-btn ${cat === selectedCategory ? 'active' : ''}" onclick="filterCategory('${cat}', this)">
          ${cat}
        </button>
      `).join("");
    }

    function filterCategory(category, element) {
      selectedCategory = category;
      
      // Ubah tombol aktif
      document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
      element.classList.add('active');

      renderProducts();
    }

    function rupiah(number) {
      return new Intl.NumberFormat("id-ID", {
        style: "currency",
        currency: "IDR",
        maximumFractionDigits: 0
      }).format(number);
    }

    function renderProducts() {
      const searchInput = document.getElementById("search");
      if (!searchInput) return;

      const keyword = searchInput.value.toLowerCase().trim();
      
      const filtered = products.filter(p => {
        const matchKeyword = (p.name || "").toLowerCase().includes(keyword);
        const matchCategory = selectedCategory === "Semua" || p.category === selectedCategory;
        return matchKeyword && matchCategory;
      });

      document.getElementById("products").innerHTML =
        filtered.length
          ? filtered.map(p => `
            <article class="card">
              <div class="picture">
                ${p.image_url 
                  ? `<img src="${p.image_url}" style="width: 100%; height: 100%; object-fit: cover;" alt="Gambar Produk">` 
                  : '📦'}
              </div>
              <div class="info">
                <div class="name">${p.name || 'Tanpa Nama'}</div>
                <div class="price">${rupiah(p.price || 0)}</div>
                <button onclick="addToCart(${p.id})">
                  + Keranjang
                </button>
              </div>
            </article>
          `).join("")
          : "<p>Produk tidak ditemukan dalam kategori ini.</p>";
    }

    function addToCart(id) {
      const product = products.find(p => p.id === id);
      const item = cart.find(p => p.id === id);

      if (item) item.qty++;
      else cart.push({ ...product, qty: 1 });

      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cartItems");
      if (!container) return;

      container.innerHTML = cart.length
        ? cart.map(p => `
          <p>
            📦 ${p.name || 'Tanpa Nama'} × ${p.qty}
            — ${rupiah((p.price || 0) * p.qty)}
            <button onclick="removeItem(${p.id})">Hapus</button>
          </p>
        `).join("")
        : "Keranjang masih kosong.";

      const total = cart.reduce((sum, p) => sum + (p.price || 0) * p.qty, 0);
      const totalEl = document.getElementById("total");
      if (totalEl) totalEl.textContent = "Total: " + rupiah(total);
    }

    function removeItem(id) {
      cart = cart.filter(p => p.id !== id);
      renderCart();
    }

    function checkout() {
      if (cart.length === 0) {
        document.getElementById("notice").textContent = "Silakan tambahkan produk ke keranjang dahulu.";
        return;
      }

      const nomorAdmin = "6281234567890"; // Ganti dengan nomor WhatsApp kamu jika belum

      let pesan = "Halo Kak, saya ingin memesan produk berikut:\n\n";
      
      cart.forEach(p => {
        pesan += `- ${p.name} (${p.qty}x) = ${rupiah(p.price * p.qty)}\n`;
      });

      const total = cart.reduce((sum, p) => sum + (p.price || 0) * p.qty, 0);
      pesan += `\n*Total Belanja: ${rupiah(total)}*\n\nMohon informasi selanjutnya, terima kasih!`;

      const urlWA = `https://wa.me/${nomorAdmin}?text=${encodeURIComponent(pesan)}`;
      window.open(urlWA, '_blank');
    }

    const searchEl = document.getElementById("search");
    if (searchEl) {
      searchEl.addEventListener("keydown", event => {
        if (event.key === "Enter") renderProducts();
      });
    }

    fetchProducts();
    renderCart();
  </script>
</body>
</html>
